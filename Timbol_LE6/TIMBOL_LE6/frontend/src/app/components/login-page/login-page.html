<div class="min-h-screen flex bg-white">
    <div class="hidden lg:flex w-1/2 bg-black text-white flex-col justify-center items-center">
        <div class="flex flex-col items-center px-8 text-center">
            <p class="text-7xl text-gray-300">THE CATHEDRAL</p>
            <p class="text-5xl text-gray-300"><b>&lt;&gt;</b></p>
            <p class="text-5xl text-gray-300">BY DINO ALFRED TIMBOL</p>
        </div>
    </div>

    <div class="fixed lg:hidden top-0 left-0 w-full bg-black p-4 text-white">
        <div class="flex flex-col items-center text-center">
            <p class="text-5xl text-gray-300">THE CATHEDRAL</p>
        </div> 
    </div>

    <div class="flex w-full lg:w-1/2 justify-center items-center bg-white">
        <div class="w-full max-w-lg px-8">
            <h1 class="text-2xl font-semibold text-gray-800 mb-6 text-center">Sign in to your account</h1>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-600 mb-1">Username</label>
                    <input
                        type="text"
                        id="username"
                        formControlName="username"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#008F11] focus:outline-none"
                        placeholder="Enter your username"
                    />
                    <div *ngIf="submitted && f['username'].errors" class="text-red-500 text-sm mt-1">
                        <span *ngIf="f['username'].errors['required']">Username is required.</span>
                        <span *ngIf="f['username'].errors['minlength']">Username is must be at least 4 characters</span>
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-600 mb-1">Password</label>
                    <input
                        type="password"
                        id="password"
                        formControlName="password"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#008F11] focus:outline-none"
                        placeholder="Enter your password"
                    />
                    <div *ngIf="submitted && f['password'].errors" class="text-red-500 text-sm mt-1">
                        <span *ngIf="f['password'].errors['required']">Password is required.</span>
                        <span *ngIf="f['password'].errors['minlength']">Must be at least 6 characters.</span>
                    </div>
                </div>

                <div *ngIf="errorMessage" class="text-red-500 text-center text-sm">
                    {{ errorMessage }}
                </div>

                <button
                    type="submit"
                    [disabled]="loginForm.invalid"
                    class="cursor-pointer w-full py-3 bg-[#008F11] text-white rounded-lg hover:bg-green-700 transition disabled:bg-gray-400 disabled:cursor-not-allowed font-semibold"
                >
                    Login now
                </button>

                <p class="text-sm text-center text-gray-500">
                    Don't have an account?
                    <a routerLink="/register" class="text-[#008F11] hover:underline">Sign Up</a>
                </p>
            </form>
        </div>
    </div>
</div>
