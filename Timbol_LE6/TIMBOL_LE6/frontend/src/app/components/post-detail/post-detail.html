<title>{{ post?.title }}</title>
<div class="bg-black text-white text-center box-border m-0 p-0 font-[Cormorant]">
    <app-nav></app-nav>

    <section class="flex flex-col justify-center items-center min-h-screen w-full px-6 lg:px-25 mb-30 text-justify">
        <h2 id="title" class="text-3xl md:text-5xl tracking-[0.2em] text-center mb-3 mt-[15rem]">
            <a routerLink="/posts/{{ post?.id}}"> {{ post?.title | uppercase }}</a>
        </h2>
        <span class="text-2xl md:text-3xl tracking-[0.2em] text-center">by {{ post?.firstName | uppercase }} {{ post?.lastName | uppercase }}: ON {{ post?.dateCreated | date:'yyyy-MM-dd' }}</span>

        <div class="flex flex-col items-center min-h-screen w-full text-white align-top text-justify">
            <div class="prose prose-invert mt-10 xl:prose-xl break-words text-white prose-blockquote:text-white">
                <div [innerHTML]="sanitizeQuill(post?.body)"></div>
            </div>
        </div>
    </section>

    <footer class="bg-white text-black font-bold text-base md:text-lg py-6">
        <div><em>THE CATHEDRAL</em> Copyright &copy; 2025 by DINO ALFRED TIMBOL.</div>
    </footer>
</div>
